name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both workspaces, and any warning fails it. The frontend uses the react-app rules the
      # build applies, so a lint problem stops the PR instead of waiting for `npm run build`;
      # the backend uses eslint:recommended for Node.
      - name: Lint
        run: npm run lint

      # Root scripts load this with dotenv-cli. Values stay empty; service tests mock Firestore.
      - name: Provide env file
        run: cp .env.example .env

      # Unit and functional tests, failing below 100% coverage. Bootstrap files (index.js,
      # lib/firebase.js, sandbox/) are excluded in frontend/package.json's jest config.
      - name: Frontend tests
        run: npm run test:coverage --workspace frontend
        env:
          CI: true

      # Unit tests only. Emulator tests are named *.integration.js, so `node --test` skips them.
      # The coverage thresholds need Node 22.8 or later.
      - name: Backend tests
        run: npm run test:coverage --workspace backend

      # The Firestore emulator runs on Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Starts a throwaway emulator (demo- project: no credentials, never the shared one), runs
      # every *.integration.js on a freshly reset baseline, then shuts the emulator down.
      - name: Integration tests (Firestore emulator)
        run: npm run test:integration
