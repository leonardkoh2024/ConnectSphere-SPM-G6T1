name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root scripts load this with dotenv-cli. Values stay empty; service tests mock Firestore.
      - name: Provide env file
        run: cp .env.example .env

      - name: Frontend tests
        run: npm test --workspace frontend -- --watchAll=false
        env:
          CI: true

      # That file throws on import unless FIRESTORE_EMULATOR_HOST is set, so it cannot be skipped by name.
      - name: Backend tests
        working-directory: backend
        run: node --test $(find src -name '*.test.js' ! -name '*.integration.test.js')

      - name: Functional tests
        run: node --test test.js
